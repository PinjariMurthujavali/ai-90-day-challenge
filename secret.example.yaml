# ============================================
# DAY 50: Kubernetes Clusters Setup
# ============================================
# TEMPLATE ONLY — copy this to `secret.yaml` (already .gitignored),
# fill in real values, and apply THAT file. Never commit real
# secrets to git — same rule as the docker-compose .env file.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secrets
  namespace: ai-chatbot
type: Opaque
stringData:
  GROQ_API_KEY: "your_groq_key_here"
  TURSO_DATABASE_URL: "your_turso_url_here"
  TURSO_AUTH_TOKEN: "your_turso_token_here"
